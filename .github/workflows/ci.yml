name: CI

# Proof that this codebase does not need WiFi hardware to be tested.
#
# GitHub's runners are virtual machines in a datacentre. There is no wireless
# adapter, no dongle, no access point, no radio of any kind within a thousand
# miles of this job. It still exercises the full 802.11 reducer, because the
# fixtures carry their own ground truth.
#
# If this job ever needs a self-hosted runner with a radio attached, something
# has gone wrong with the test strategy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tshark
        # noninteractive stops the wireshark-common debconf prompt hanging the job
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark --version | head -1

      - name: Install both packages (one repo, two deployables — ADR-26)
        run: |
          pip install -e ".[dev]"
          pip install -e "./wd-server[dev]"

      - name: Regenerate fixture and confirm it is reproducible
        # The committed pcap must match what make_fixture.py produces. If it
        # drifts, the tests are asserting against a stale artefact.
        run: |
          cp tests/fixtures/wifi_lab.pcap /tmp/committed.pcap
          python tests/fixtures/make_fixture.py
          cmp /tmp/committed.pcap tests/fixtures/wifi_lab.pcap \
            || (echo "::error::committed fixture differs from generator output"; exit 1)

      - name: Run probe tests
        run: pytest -q

      - name: Run server tests (incl. parity ADR-28 and end-to-end smoke test)
        run: pytest -q wd-server/tests

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests
          (cd wd-server && ruff check src tests)

      - name: Smoke-test the CLI end to end
        run: |
          wd-probe reduce tests/fixtures/wifi_lab.pcap --channel 36 --spool /tmp/ci.db
          wd-probe sessions --spool /tmp/ci.db
          wd-probe status --spool /tmp/ci.db
